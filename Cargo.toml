[package]
name = "present-latency"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
pollster = "1.0.1"
rustix = { version = "1.1.6", default-features = false, features = ["time"] }
wayland-backend = { version = "0.3.17", features = ["client_system", "rwh_06"] }
wayland-client = { version = "0.31.15", features = ["system"] }
wayland-protocols = { version = "0.32.13", features = ["client"] }
wgpu = { version = "30.0.1", default-features = false, features = ["vulkan", "wgsl", "parking_lot", "std"] }
wgpu_text = "30.0.1"
